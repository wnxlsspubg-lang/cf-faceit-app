name: Build CF FACEIT apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CF-FACEIT.apk
      - uses: actions/upload-artifact@v4
        with: { name: CF-FACEIT-android, path: CF-FACEIT.apk }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project CFFaceit.xcodeproj -target CFFaceit -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -R "ios/build/Release-iphoneos/CF FACEIT.app" Payload/
          zip -qry CF-FACEIT-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: CF-FACEIT-ios, path: CF-FACEIT-unsigned.ipa }
